name: 'Terraform'

on:
  push:
    branches: [ "master" ]
  pull_request:
  # This adds the manual trigger with an option dropdown
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose whether to Deploy or Destroy infrastructure'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: write

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt

      - name: Commit formatted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format Terraform files [skip ci]"
          file_pattern: '*.tf *.tfvars' # Fixed path pattern relative to working-directory

      # Only plan a standard deployment if the user didn't pick "destroy"
      - name: Terraform Plan
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: terraform plan -var-file="dev.tfvars"

      # Generate a destroy plan if the user explicitly picked "destroy"
      - name: Terraform Destroy Plan
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform plan -destroy -var-file="dev.tfvars"

      # Standard Apply: Runs on automatic pushes to master OR when manually triggered as 'apply'
      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve -var-file="dev.tfvars"

      # Destroy: ONLY runs if manually triggered and user explicitly picked 'destroy'
      - name: Terraform Destroy
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve -var-file="dev.tfvars"
