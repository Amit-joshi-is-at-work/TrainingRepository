name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ] # Triggers the pipeline whenever code is pushed to main
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code to the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Log in to Docker Hub using repository secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Set up Docker Buildx (required for advanced caching)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Frontend
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./frontend.Dockerfile # Adjust this if your Dockerfile is inside a subfolder like ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:${{ github.sha }}

    # 4. Build and Push Backend Image
    - name: Build and Push Backend
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./patient.Dockerfile # Adjust this if your Dockerfile is inside a subfolder like ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:${{ github.sha }}
