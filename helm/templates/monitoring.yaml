### MONITORING TIER (Prometheus & Grafana)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'spring-boot-app'
        metrics_path: '/actuator/prometheus'
        static_configs:
          # Note: Since your chart comments mentioned a "secure internal route", 
          # you can use 'backend-metrics-internal:8087' instead of the AWS ELB string here!
          - targets: ['backend-metrics-internal:{{ .Values.backend.port }}']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-monitoring
  template:
    metadata:
      labels:
        app: prometheus-monitoring
    spec:
      containers:
        - name: postgres # Kept from your manifest, though usually named 'prometheus'
          image: {{ .Values.monitoring.prometheusImage }}
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: prometheus-monitoring
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-visuals
  template:
    metadata:
      labels:
        app: grafana-visuals
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafanaImage }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.monitoring.grafanaPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: {{ .Values.namespace }}
spec:
  type: LoadBalancer
  selector:
    app: grafana-visuals
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000