<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f7f6;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            max-width: 500px;
            white-space: pre-wrap; /* Keeps JSON formatting readable */
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

<h2>Patient Database</h2>
<button id="fetchPatientsBtn">Fetch Patient List</button>

<h3>Results:</h3>
<div id="result">No data fetched yet.</div>

<script>
    document.getElementById('fetchPatientsBtn').addEventListener('click', () => {
        const resultDiv = document.getElementById('result');
        resultDiv.textContent = 'Loading...';

        // Making the call to localhost:8087
        // Update '/patients' to whatever your specific endpoint path is (e.g., '/api/patients')
        fetch('/patients')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json(); // Assumes server returns JSON
            })
            .then(data => {
                // Pretty-print the JSON response into the div
                resultDiv.classList.remove('error');
                resultDiv.textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                // Handle network errors or server downtime
                resultDiv.classList.add('error');
                resultDiv.textContent = `Error fetching data: ${error.message}\n\n(Make sure your backend is running on port 8087 and CORS is enabled!)`;
            });
    });
</script>

</body>
</html>
