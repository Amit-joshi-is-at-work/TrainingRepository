version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres_container
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: # <--- Added healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres -d patientdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  patient-app:
    build:
      context: .
      dockerfile: patient.Dockerfile
    container_name: springboot_container
    ports:
      - "8087:8087"
    depends_on:
      postgres-db:
        condition: service_healthy # <--- App waits until Postgres passes the healthcheck
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: patientdb
      DB_USERNAME: postgres
      DB_PASSWORD: mysecretpassword

  patient-app-frontend:
    build:
      context: ./ui
      dockerfile: frontend.Dockerfile
    container_name: ui_container
    ports:
      - "4200:4200"

volumes:
  pgdata: